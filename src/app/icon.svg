<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Linia">
  <style>
    .paper { fill: #d8dee8; }
    .mast, .lamp-mid, .lamp-low { fill: #12151a; }
    .lamp-mid { opacity: 0.35; }
    .lamp-low { opacity: 0.18; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #0c0e12; }
      .mast { fill: #1a1f27; }
      .lamp-mid, .lamp-low { fill: #ffb020; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="0" />
  <rect class="mast" x="14" y="4" width="4" height="24" rx="0" />
  <circle cx="16" cy="10" r="5" fill="#ffb020" />
  <circle class="lamp-mid" cx="16" cy="18.5" r="3.2" />
  <circle class="lamp-low" cx="16" cy="24.5" r="2.4" />
</svg>
